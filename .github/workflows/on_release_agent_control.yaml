name: Publish agent to catalog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g., v1.5.7)'
        required: true
        type: string
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  oci-publish:
    uses: newrelic/coreint-automation/.github/workflows/reusable_agent_control_release.yaml@v3
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      agent_type: NRIWinServices
      display_name: "Windows Services"
      monitoring_type: "INFRA"
      oci_registry: "docker.io/newrelic/nri-winservices-artifacts"
      artifacts: |
        [
          {"name":"windows-amd64","os":"windows","arch":"amd64","format":"zip","source_asset":"nri-winservices-v{version}-amd64.zip","source_format":"zip","keep_files":["nri-winservices.exe","windows_exporter.exe"]}
        ]
    secrets:
      OHAI_NEWRELIC_CLIENT_ID: ${{ secrets.OHAI_NEWRELIC_CLIENT_ID }}
      OHAI_NEWRELIC_PRIVATE_KEY: ${{ secrets.OHAI_NEWRELIC_PRIVATE_KEY }}
      OHAI_OCI_USERNAME: ${{ secrets.OHAI_OCI_USERNAME }}
      OHAI_OCI_PASSWORD: ${{ secrets.OHAI_OCI_PASSWORD }}
      AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
